name: Фіксатор часу — Android APK

on:
  push:
    branches: [claude/festive-knuth-nvpfzo, main]
    paths:
      - "production-time-tracker/android/**"
      - ".github/workflows/tracker-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-time-tracker/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Стабільний ключ підпису між збірками, щоб новий APK ставився поверх старого
      # (без видалення додатка й без втрати ще не відправлених подій).
      # Якщо задано секрети ANDROID_KEYSTORE_*, використовуються вони (найнадійніше).
      # Інакше ключ генерується один раз і зберігається в кеші GitHub Actions (не в репозиторії).
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: ~/tracker-signing
          key: tracker-signing-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            {
              echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/signing.jks"
              echo "ANDROID_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            # Стандартні параметри Android debug-ключа.
            mkdir -p ~/tracker-signing
            if [ ! -f ~/tracker-signing/debug.jks ]; then
              keytool -genkeypair -keystore ~/tracker-signing/debug.jks -alias androiddebugkey \
                -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "::notice::Створено новий ключ підпису APK"
            fi
            {
              echo "ANDROID_SIGNING_STORE_FILE=$HOME/tracker-signing/debug.jks"
              echo "ANDROID_SIGNING_STORE_PASSWORD=android"
              echo "ANDROID_SIGNING_KEY_ALIAS=androiddebugkey"
              echo "ANDROID_SIGNING_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Unit tests and APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/fiksator-chasu.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fiksator-chasu-apk
          path: ${{ runner.temp }}/fiksator-chasu.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: production-time-tracker/android/app/build/reports/

      # Постійне посилання для планшета:
      # https://github.com/<owner>/<repo>/releases/download/tracker-apk-latest/fiksator-chasu.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tracker-apk-latest --yes --cleanup-tag || true
          gh release create tracker-apk-latest "$RUNNER_TEMP/fiksator-chasu.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Фіксатор часу 1.0.$GITHUB_RUN_NUMBER" \
            --notes "Автоматична збірка з гілки $GITHUB_REF_NAME ($GITHUB_SHA). Відкрийте це посилання на планшеті та встановіть APK."
